<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="toastGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="70%" stop-color="#111111"/>
      <stop offset="85%" stop-color="#FF8A2B"/>
      <stop offset="100%" stop-color="#D95A00"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    #toast-body {
      transform-origin: 60px 85px;
      animation: toast-breathe 1.8s ease-in-out infinite;
    }
    #steam1 {
      animation: steam-rise 1.6s ease-in-out infinite;
    }
    #steam2 {
      animation: steam-rise 1.6s ease-in-out infinite 0.25s;
    }
    @keyframes toast-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    @keyframes steam-rise {
      0% { transform: translateY(0px) scaleY(1) scaleX(1); opacity: 0.9; }
      50% { transform: translateY(-6px) scaleY(1.1) scaleX(0.95); opacity: 0.7; }
      100% { transform: translateY(-12px) scaleY(1.2) scaleX(1.05); opacity: 0; }
    }
  </style>

  <!-- Steam -->
  <g id="steams">
    <path id="steam1" d="M 52 28 Q 48 20, 54 12 Q 60 4, 56 -2" fill="none" stroke="url(#steamGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <path id="steam2" d="M 68 30 Q 64 22, 70 14 Q 76 6, 72 0" fill="none" stroke="url(#steamGrad)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Toast Body -->
  <g id="toast-body">
    <!-- Outer toast shape -->
    <path d="M 20 52 
             C 20 38, 28 32, 40 35 
             Q 60 42, 80 35 
             C 92 32, 100 38, 100 52
             L 100 88 
             Q 100 104, 82 104 
             L 38 104 
             Q 20 104, 20 88 Z" 
          fill="none" stroke="url(#toastGradient)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Inner detail lines -->
    <rect x="38" y="68" width="28" height="6" rx="3" fill="#111"/>
    <rect x="38" y="79" width="22" height="5" rx="2.5" fill="#111"/>
    <rect x="38" y="88" width="26" height="5" rx="2.5" fill="#111"/>
    <!-- Orange glow corner - subtle fill overlay -->
    <path d="M 84 62 Q 96 64, 96 88 Q 96 100, 82 102 L 82 88 Q 82 76, 84 62 Z" fill="#FF8A2B" opacity="0.18"/>
  </g>
</svg>
