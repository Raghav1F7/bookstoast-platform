name: Build Bookstoast Platform Image

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - '.github/workflows/build-platform-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: true
          tags: |
            ghcr.io/raghav1f7/bookstoast-platform-web:latest
            ghcr.io/raghav1f7/bookstoast-platform-web:${{ github.sha }}
          cache-from: type=gha,scope=bookstoast-platform-web
          cache-to: type=gha,mode=max,scope=bookstoast-platform-web
